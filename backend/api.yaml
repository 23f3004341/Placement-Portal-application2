openapi: 3.0.3
info:
  title: Placement Portal Application API
  version: 1.0.0
  description: |
    OpenAPI specification for the Placement Portal Flask API.
    The browser UI is a Vue CLI single-page application in the frontend folder.
    Flask exposes JSON APIs, uses SQLite for persistence, Redis for caching, and
    Redis/Celery for batch jobs.

servers:
  - url: http://127.0.0.1:5000
    description: Local development server

tags:
  - name: Public
  - name: Auth
  - name: Registration
  - name: Admin
  - name: Student
  - name: Company

paths:
  /:
    get:
      tags: [Public]
      summary: API root
      responses:
        "200":
          description: API service information
          content:
            application/json:
              schema:
                type: object

  /login:
    get:
      tags: [Auth]
      summary: Login page
      responses:
        "200":
          description: HTML login form
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Auth]
      summary: Login submit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginForm"
      responses:
        "302":
          description: Redirects to role dashboard on success
        "200":
          description: Login page re-rendered with error flash
          content:
            text/html:
              schema:
                type: string

  /login/{role}:
    get:
      tags: [Auth]
      summary: Login page pre-selected for role
      parameters:
        - $ref: "#/components/parameters/RolePath"
      responses:
        "200":
          description: HTML login form
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Auth]
      summary: Login submit for role
      parameters:
        - $ref: "#/components/parameters/RolePath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginForm"
      responses:
        "302":
          description: Redirects to role dashboard on success
        "200":
          description: Login page re-rendered with validation/access error
          content:
            text/html:
              schema:
                type: string

  /logout:
    get:
      tags: [Auth]
      summary: Logout current user
      security:
        - cookieAuth: []
      responses:
        "302":
          description: Redirects to home page

  /dashboard:
    get:
      tags: [Auth]
      summary: Redirect to role-specific dashboard
      security:
        - cookieAuth: []
      responses:
        "302":
          description: Redirect to admin/student/company dashboard

  /register/student:
    get:
      tags: [Registration]
      summary: Student registration page
      responses:
        "200":
          description: HTML registration form
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Registration]
      summary: Register student account
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudentRegistrationForm"
      responses:
        "302":
          description: Redirect to student login on success
        "200":
          description: Registration page with validation errors
          content:
            text/html:
              schema:
                type: string

  /register/company:
    get:
      tags: [Registration]
      summary: Company registration page
      responses:
        "200":
          description: HTML registration form
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Registration]
      summary: Register company account (pending admin approval)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CompanyRegistrationForm"
      responses:
        "302":
          description: Redirect to company login on success
        "200":
          description: Registration page with validation errors
          content:
            text/html:
              schema:
                type: string

  /dashboard/admin:
    get:
      tags: [Admin]
      summary: Admin dashboard
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML dashboard page
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect if role is not admin

  /dashboard/admin/company-approvals:
    get:
      tags: [Admin]
      summary: Company approvals and reviewed companies
      security:
        - cookieAuth: []
      parameters:
        - name: company_q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: HTML page listing pending/reviewed companies
          content:
            text/html:
              schema:
                type: string

  /dashboard/admin/company-approvals/{user_id}:
    get:
      tags: [Admin]
      summary: Company approval detail view
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: HTML detail page
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Company user not found

  /dashboard/admin/drives:
    get:
      tags: [Admin]
      summary: All placement drives
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML drives listing
          content:
            text/html:
              schema:
                type: string

  /dashboard/admin/drives/{job_id}:
    get:
      tags: [Admin]
      summary: Drive detail view
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      responses:
        "200":
          description: HTML drive detail
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Drive not found

  /dashboard/admin/applications:
    get:
      tags: [Admin]
      summary: All applications and placements
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML listing page
          content:
            text/html:
              schema:
                type: string

  /dashboard/admin/search-students:
    get:
      tags: [Admin]
      summary: Student search page
      security:
        - cookieAuth: []
      parameters:
        - name: student_q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: HTML search page
          content:
            text/html:
              schema:
                type: string

  /dashboard/admin/students/{student_id}:
    get:
      tags: [Admin]
      summary: Student profile view
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
      responses:
        "200":
          description: HTML student details
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Student not found

  /dashboard/admin/students/{student_id}/edit:
    get:
      tags: [Admin]
      summary: Edit student form
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
      responses:
        "200":
          description: HTML edit form
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Admin]
      summary: Update student profile by admin
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudentEditForm"
      responses:
        "302":
          description: Redirect to student search page on success
        "200":
          description: Form re-rendered with validation errors

  /dashboard/admin/companies/{company_id}/edit:
    get:
      tags: [Admin]
      summary: Edit company form
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
      responses:
        "200":
          description: HTML edit form
    post:
      tags: [Admin]
      summary: Update company profile by admin
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CompanyAdminEditForm"
      responses:
        "302":
          description: Redirect to company approvals page
        "200":
          description: Form re-rendered with validation errors

  /admin/company/{user_id}/approval:
    post:
      tags: [Admin]
      summary: Approve or reject company registration
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                next:
                  type: string
      responses:
        "302":
          description: Redirect to admin company approvals page

  /admin/drive/{job_id}/approval:
    post:
      tags: [Admin]
      summary: Approve or reject a placement drive
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                next:
                  type: string
      responses:
        "302":
          description: Redirect to admin drives page

  /admin/user/{user_id}/status:
    post:
      tags: [Admin]
      summary: Activate or blacklist a student/company account
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [activate, deactivate, blacklist]
                next:
                  type: string
      responses:
        "302":
          description: Redirect to appropriate admin page

  /admin/user/{user_id}/delete:
    post:
      tags: [Admin]
      summary: Delete student/company account
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "302":
          description: Redirect to appropriate admin page

  /dashboard/student:
    get:
      tags: [Student]
      summary: Student dashboard
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML student dashboard
        "302":
          description: Redirect if role is not student

  /dashboard/student/drives:
    get:
      tags: [Student]
      summary: List approved drives and current application state
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML approved drives page

  /student/drives/{job_id}/apply:
    post:
      tags: [Student]
      summary: Apply (or re-apply after withdraw) to a drive
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                cover_letter:
                  type: string
      responses:
        "302":
          description: Redirect to student drives page with flash message

  /student/applications/{application_id}/withdraw:
    post:
      tags: [Student]
      summary: Withdraw (undo) an application
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationIdPath"
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                next:
                  type: string
      responses:
        "302":
          description: Redirect to student page with updated status

  /dashboard/student/applications:
    get:
      tags: [Student]
      summary: Combined applications and placements page
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML applications/placements page

  /dashboard/student/profile:
    get:
      tags: [Student]
      summary: Student profile edit page
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML profile page
    post:
      tags: [Student]
      summary: Update student profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudentEditForm"
      responses:
        "302":
          description: Redirect to profile page on success
        "200":
          description: Form re-rendered with errors

  /dashboard/company:
    get:
      tags: [Company]
      summary: Company dashboard
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML company dashboard
        "302":
          description: Redirect if role is not company

  /dashboard/company/profile:
    get:
      tags: [Company]
      summary: Company profile edit page
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML company profile page
    post:
      tags: [Company]
      summary: Update company profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CompanyProfileEditForm"
      responses:
        "302":
          description: Redirect to company profile on success
        "200":
          description: Form re-rendered with errors

  /dashboard/company/drives:
    get:
      tags: [Company]
      summary: List company's placement drives
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML drives page

  /dashboard/company/drives/create:
    get:
      tags: [Company]
      summary: Create drive form
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML create form
    post:
      tags: [Company]
      summary: Create placement drive (status pending for admin approval)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CompanyDriveForm"
      responses:
        "302":
          description: Redirect to company drives page
        "200":
          description: Form re-rendered with validation errors

  /dashboard/company/drives/{job_id}/edit:
    get:
      tags: [Company]
      summary: Edit drive form
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      responses:
        "200":
          description: HTML edit form
    post:
      tags: [Company]
      summary: Update placement drive
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CompanyDriveForm"
      responses:
        "302":
          description: Redirect to company drives page
        "200":
          description: Form re-rendered with validation errors

  /dashboard/company/drives/{job_id}/close:
    post:
      tags: [Company]
      summary: Close an active drive
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                next:
                  type: string
      responses:
        "302":
          description: Redirect to company drives/dashboard

  /dashboard/company/drives/{job_id}/delete:
    post:
      tags: [Company]
      summary: Soft-remove drive from active listings
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                next:
                  type: string
      responses:
        "302":
          description: Redirect to company drives/dashboard

  /dashboard/company/applications:
    get:
      tags: [Company]
      summary: List company applications (withdrawn excluded)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML applications page

  /dashboard/company/drives/{job_id}/applications:
    get:
      tags: [Company]
      summary: Applications for a specific drive (withdrawn excluded)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      responses:
        "200":
          description: HTML drive applications page
        "404":
          description: Drive not found

  /dashboard/company/students/{student_id}:
    get:
      tags: [Company]
      summary: Student profile view from company portal
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
      responses:
        "200":
          description: HTML student profile and application history
        "404":
          description: Student not found / not visible for company

  /dashboard/company/applications/{application_id}/status:
    post:
      tags: [Company]
      summary: Update application status
      description: |
        Allowed actions: shortlisted, selected, rejected.
        Withdrawn applications are not updatable from company portal.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationIdPath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [shortlisted, selected, rejected]
                next:
                  type: string
      responses:
        "302":
          description: Redirect to company drive applications page

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    RolePath:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum: [admin, student, company]
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StudentIdPath:
      name: student_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CompanyIdPath:
      name: company_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ApplicationIdPath:
      name: application_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    LoginForm:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    StudentRegistrationForm:
      type: object
      required:
        - first_name
        - last_name
        - email_address
        - password
        - confirm_password
        - contact_number
        - address_line1
        - pincode
        - gender
        - dob
        - course
        - branch
        - graduation_year
        - cgpa
        - resume
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        email_address:
          type: string
          format: email
        password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password
        contact_number:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        landmark:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        gender:
          type: string
        dob:
          type: string
          format: date
        course:
          type: string
        branch:
          type: string
        graduation_year:
          type: integer
        cgpa:
          type: number
          format: float
        resume:
          type: string
          format: binary

    CompanyRegistrationForm:
      type: object
      required:
        - email_address
        - password
        - confirm_password
        - address_line1
        - pincode
        - company_name
        - website
        - industry
        - headquarters
        - hr_name
        - hr_email
        - hr_phone
      properties:
        email_address:
          type: string
          format: email
        password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password
        address_line1:
          type: string
        address_line2:
          type: string
        landmark:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        company_name:
          type: string
        website:
          type: string
          format: uri
        industry:
          type: string
        headquarters:
          type: string
        description:
          type: string
        hr_name:
          type: string
        hr_email:
          type: string
          format: email
        hr_phone:
          type: string

    StudentEditForm:
      type: object
      required:
        - first_name
        - last_name
        - email_address
        - contact_number
        - address_line1
        - pincode
        - gender
        - dob
        - course
        - branch
        - graduation_year
        - cgpa
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        email_address:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Optional new password
        confirm_password:
          type: string
          format: password
        contact_number:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        landmark:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        gender:
          type: string
        dob:
          type: string
          format: date
        course:
          type: string
        branch:
          type: string
        graduation_year:
          type: integer
        cgpa:
          type: number
          format: float
        resume:
          type: string
          format: binary

    CompanyAdminEditForm:
      type: object
      required:
        - company_name
        - email_address
        - address_line1
        - pincode
        - website
        - industry
        - headquarters
        - hr_name
        - hr_email
        - hr_phone
      properties:
        company_name:
          type: string
        email_address:
          type: string
          format: email
        address_line1:
          type: string
        address_line2:
          type: string
        landmark:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        website:
          type: string
          format: uri
        industry:
          type: string
        headquarters:
          type: string
        description:
          type: string
        hr_name:
          type: string
        hr_email:
          type: string
          format: email
        hr_phone:
          type: string

    CompanyProfileEditForm:
      type: object
      required:
        - company_name
      properties:
        company_name:
          type: string
        website:
          type: string
          format: uri
        industry:
          type: string
        headquarters:
          type: string
        description:
          type: string
        hr_name:
          type: string
        hr_email:
          type: string
          format: email
        hr_phone:
          type: string

    CompanyDriveForm:
      type: object
      required:
        - title
        - job_type
        - location
        - salary_lpa
        - salary_unit
        - openings
        - min_cgpa
        - eligible_degrees
        - eligible_branches
        - description
        - application_deadline
      properties:
        title:
          type: string
        job_type:
          type: string
          enum: [internship, full-time, contract]
        location:
          type: string
        salary_lpa:
          type: number
          format: float
          description: Numeric salary/stipend amount
        salary_unit:
          type: string
          enum: [lpa, k_month]
          description: Unit displayed as LPA or K/month
        openings:
          type: integer
        min_cgpa:
          type: number
          format: float
        eligible_degrees:
          type: array
          items:
            type: string
        eligible_branches:
          type: array
          items:
            type: string
        description:
          type: string
        application_deadline:
          type: string
          format: date
