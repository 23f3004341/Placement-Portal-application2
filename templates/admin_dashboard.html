{% extends "admin_base.html" %}
{% block admin_title %}Admin Dashboard{% endblock %}

{% block admin_page_content %}
<section class="card section-card">
    <div class="card-body p-4 p-md-5">
        <h1 class="display-6 fw-bold admin-welcome-title mb-2">Welcome, Admin</h1>
        <p class="text-secondary mb-0">
            Use the left menu to open each management module on a separate page.
        </p>
    </div>
</section>

<section class="card section-card">
    <div class="card-body p-4">
        <h5 class="fw-bold mb-3">Placement Statistics</h5>
        <div class="row g-3">
            <div class="col-12 col-xl-5">
                <img
                    class="img-fluid w-100 border rounded"
                    src="data:image/png;base64,{{ application_status_chart }}"
                    alt="Application status chart"
                >
            </div>
            <div class="col-12 col-xl-7">
                <img
                    class="img-fluid w-100 border rounded"
                    src="data:image/png;base64,{{ drive_outcomes_chart }}"
                    alt="Drive outcomes by company and role chart"
                >
            </div>
        </div>
    </div>
</section>
{% endblock %}
